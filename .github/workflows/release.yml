name: Release

# A new version number in manifest.json makes a numbered release, with its notes taken from CHANGELOG.md.
on:
  push:
    branches: [main]
    paths:
      - custom_components/roost_atelier/manifest.json
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests
        run: |
          npm ci --legacy-peer-deps
          npm test

      - name: Version
        id: v
        run: |
          V=$(python3 -c "import json;print(json.load(open('custom_components/roost_atelier/manifest.json'))['version'])")
          P=$(node -p "require('./package.json').version")
          [ "$V" = "$P" ] || { echo "manifest.json says $V but package.json says $P"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Release (only if this version is new)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V is already released."
            exit 0
          fi
          python3 .github/scripts/release_notes.py "$V" > notes.md
          gh release create "v$V" --title "Roost Atelier $V" --notes-file notes.md --target "$GITHUB_SHA"
